<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <title>Calculadora</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link href="styles.css" rel="stylesheet">
    <script src="script.js"></script>
</head>

<body>
    <header>
        <!-- place navbar here -->
    </header>
    <main>
        <div class="container">
            <div class="row mb-2">
                <div class="container-fluid d-flex align-items-center justify-content-center">
                    <textarea class="form-textarea" id="areaResultados" placeholder="Resultados..." rows="3" disabled></textarea>
                </div>
            </div>
            <!--Area de botones de digitos-->
            <div class="container mb-2">
                <div class="container" id="areaBotones">
                    <div class="row d-flex align-items-center justify-content-center mb-2">
                        <div class="d-flex align-items-center justify-content-center col-12 col-md-6" id="filaBotones">
                            <button type="button" class="btn btn-light" id="numeros_btn0">0</button>
                            <button type="button" class="btn btn-light" id="numeros_btn1">1</button>
                            <button type="button" class="btn btn-light" id="numeros_btn2">2</button>
                        </div>
                    </div>
                    <div class="row d-flex align-items-center justify-content-center mb-2">
                        <div class="d-flex align-items-center justify-content-center col-12 col-md-6" id="filaBotones">
                            <button type="button" class="btn btn-light" id="numeros_btn3">3</button>
                            <button type="button" class="btn btn-light" id="numeros_btn4">4</button>
                            <button type="button" class="btn btn-light" id="numeros_btn5">5</button>
                        </div>
                    </div>
                    <div class="row d-flex align-items-center justify-content-center mb-2">
                        <div class="d-flex align-items-center justify-content-center col-12 col-md-6" id="filaBotones">
                            <button type="button" class="btn btn-light" id="numeros_btn6">6</button>
                            <button type="button" class="btn btn-light" id="numeros_btn7">7</button>
                            <button type="button" class="btn btn-light" id="numeros_btn8">8</button>
                        </div>
                    </div>
                    <div class="row d-flex align-items-center justify-content-center mb-2">
                        <div class="d-flex align-items-center justify-content-center col-12 col-md-6" id="filaBotones">
                            <button type="button" class="btn btn-light" id="btnDecimal">.00</button>
                            <button type="button" class="btn btn-light" id="btnLimpiar">C</button>
                            <button type="button" class="btn btn-light" id="numeros_btn9">9</button>
                            <button type="button" class="btn btn-light" id="btnResolver">=</button>
                        </div>
                    </div>
                    <!--Operaciones-->
                    <div class="row d-flex align-items-center justify-content-center mb-2 bg-danger">
                        <div class="d-flex align-items-center justify-content-center col-12 col-md-6 mt-2 mb-2" id="filaBotones">
                            <button type="button" class="btn btn-light" id="operacion_btnSumar">+</button>
                            <button type="button" class="btn btn-light" id="operacion_btnRestar">-</button>
                            <button type="button" class="btn btn-light" id="operacion_btnMultiplicar">*</button>
                            <button type="button" class="btn btn-light" id="operacion_btnDividir">/</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>
    <footer>
        <!-- place footer here -->
    </footer>
    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
